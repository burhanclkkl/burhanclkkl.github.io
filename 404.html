<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF9F7">
  <link rel="icon" type="image/svg+xml" href="/helloworld/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <title>Sayfa bulunamadı — OPEN / NOTES</title>
  <style>
    :root { color-scheme:light; --bg:#FAF9F7; --ink:#27232C; --muted:#67616C; --line:#EAE5ED; --lilac:#7957B0; --orange:#B45320; }
    @media(prefers-color-scheme:dark) { :root { color-scheme:dark; --bg:#17161A; --ink:#F3F0F1; --muted:#ABA6B0; --line:#39353E; --lilac:#C5B0EF; --orange:#FFAC7B; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; }
    .shell { width:min(1060px,calc(100% - 40px)); min-height:100dvh; margin:auto; display:flex; flex-direction:column; }
    header { padding:30px 0; border-bottom:1px solid var(--line); font-weight:700; letter-spacing:-.04em; display:flex; align-items:center; gap:12px; }
    svg { width:24px; height:24px; transform:rotate(-12deg); } .slash { color:var(--lilac); } main { flex:1; padding:clamp(45px,9vh,100px) 0; }
    .eyebrow,footer { color:var(--muted); font-size:10px; letter-spacing:.06em; } .code { margin:18px 0 20px; color:var(--lilac); font-size:clamp(100px,21vw,220px); font-weight:700; line-height:1; letter-spacing:-.1em; } .code span { color:var(--orange); }
    h1 { margin:0 0 20px; font-size:clamp(27px,5vw,50px); letter-spacing:-.065em; line-height:1.2; } p { max-width:550px; color:var(--muted); font-size:13px; line-height:1.9; }
    nav { margin-top:34px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; } a { display:inline-flex; gap:24px; color:var(--lilac); text-decoration:none; font-size:12px; padding:14px 0; } .primary { background:var(--ink); color:var(--bg); padding:15px 20px; border-radius:7px; } a:hover { text-decoration:underline; text-underline-offset:4px; } a:focus-visible { outline:2px solid var(--lilac); outline-offset:5px; }
    footer { border-top:1px solid var(--line); padding:24px 0; line-height:1.8; }
  </style>
</head>
<body>
  <div class="shell">
    <header><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="9" height="9" rx="1" fill="currentColor"/><rect x="13" width="9" height="9" rx="1" fill="#AE91E8"/><rect y="13" width="9" height="9" rx="1" fill="#51BA93"/><rect x="13" y="13" width="9" height="9" rx="1" fill="#FF975E"/></svg><span>OPEN <span class="slash">/</span> NOTES.</span></header>
    <main>
      <div class="eyebrow">BAĞLANTI / BULUNAMADI</div>
      <div class="code" aria-hidden="true">40<span>4</span></div>
      <h1>Bu sayfa arşivde yok.</h1>
      <p>Bağlantı değişmiş, sayfa kaldırılmış ya da adres yanlış yazılmış olabilir. Merakını konu arşivinden sürdür.</p>
      <nav aria-label="Arşive dönüş">
      <a class="primary" href="/helloworld/index.html#topics">Konu arşivine dön <span aria-hidden="true">↗</span></a>
      <a href="/helloworld/index.html">Ana sayfa <span aria-hidden="true">→</span></a>
      </nav>
    </main>
    <footer>OPEN / NOTES · MERAK ETMEYE DEVAM.</footer>
  </div>
</body>
</html>
